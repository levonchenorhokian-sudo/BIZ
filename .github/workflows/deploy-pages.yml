name: Deploy site to GitHub Pages

# The site is plain static files in site/ — nothing to build, just upload.
#
# One-time prerequisite: Settings -> Pages -> Build and deployment -> Source
# must be set to "GitHub Actions". The workflow token cannot create the Pages
# site itself (the API returns "Resource not accessible by integration"), so
# enabling it is a manual step. After that this workflow needs no attention.
#
# Custom domain: set it in Settings -> Pages -> Custom domain. Committing a
# CNAME file does NOT register the domain when the source is GitHub Actions —
# that mechanism only applies to branch-based publishing. A domain saved in
# Settings also only takes effect once a deployment runs afterwards, so re-run
# this workflow after changing it.

on:
  push:
    branches: [claude/lebanon-uniform-strategy-zob4rv]
    paths:
      - "site/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; let a newer push supersede a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # Jekyll would otherwise ignore files and folders beginning with _ ,
      # which would drop the _ds/ design-system directory the pages rely on.
      - name: Disable Jekyll processing
        run: touch site/.nojekyll

      - name: Upload site/
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
