# Netlify deploy config for the static site in site/.
# No build step — the site is plain HTML/CSS/JS with vendored dependencies.

[build]
  publish = "site"
  command = ""

# Long-cache the immutable vendored libraries and textures.
[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/tex/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Sensible security headers for a brochure site.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
